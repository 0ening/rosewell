<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有線耳機復活計畫 | 會員編號</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chinese-fonts/pml@1.0.1/dist/index.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Comic Sans MS', "PML", 'PMingLiU', '新細明體', serif;
            /* Aero 漸層背景 */
            background: linear-gradient(180deg, #d4f0ff 0%, #ffffff 50%, #b5f5c6 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* 頂部導覽列：復古藍色粗邊框框 */
        .top-nav {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-around;
            border: 4px solid #1e90ff;
            background: white;
            padding: 10px;
            margin-bottom: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .top-nav a { 
            color: #000; 
            text-decoration: none; 
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer; 
        }
        .top-nav a:hover { color: #1e90ff; }

        /* 復古視窗面板 */
        .window-panel {
            background: #f0f4f8;
            border: 2px solid #8ba3c7;
            box-shadow: 4px 4px 0px #4a148c; /* 修改為暗紫色 */
            width: 100%;
            max-width: 500px;
            padding: 15px;
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        /* 視窗標題列 */
        .window-header {
            border-bottom: 1px solid #8ba3c7;
            padding-bottom: 5px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #4a3b7a;
            text-align: left;
            display: flex;
            justify-content: space-between;
        }

        /* 內部白色資訊框 */
        .info-box {
            background: white;
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info-box p {
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* 數字顯示區 (復古終端機/跑馬燈風格) */
        .number-area { 
            display: inline-block; 
            background: #2a004f; /* 配合風格修改為深紫底色 */
            border: 2px inset #fff; 
            padding: 15px 30px; 
            margin: 15px 0; 
        }
        .custom-number { 
            font-size: 2.5rem; 
            font-weight: bold; 
            color: #00ff00; /* 螢光綠 */
            letter-spacing: 4px; 
            font-family: monospace, serif; 
        }

        /* 3D 果凍按鈕群 */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .btn-glossy {
            background: linear-gradient(180deg, #a8ff78, #78ffd6); 
            border: 2px solid #2e8b57;
            border-radius: 20px;
            padding: 8px 20px;
            font-family: 'PMingLiU', '新細明體', serif; /* 修改為新細明體 */
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
            box-shadow: inset 0px 8px 10px rgba(255,255,255,0.6), 3px 3px 5px rgba(0,0,0,0.3);
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-glossy:active {
            box-shadow: inset 0px 2px 5px rgba(0,0,0,0.5);
            transform: translateY(2px);
        }
        .btn-yellow { 
            background: linear-gradient(180deg, #fffacd, #ffd700); 
            border-color: #b8860b; 
        }
        
        /* 彈出視窗 (Modal) */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background-color: rgba(0, 0, 0, 0.4); 
            z-index: 100; 
            justify-content: center; 
            align-items: center; 
        }
        
        /* 復古對話框 */
        .modal-content { 
            background-color: #ece9d8; /* Windows XP 經典對話框色 */
            border: 2px outset #fff; 
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5); 
            width: 85%; 
            max-width: 350px; 
            padding: 20px; 
            position: relative; 
            text-align: left; 
        }
        
        /* 視窗關閉按鈕 */
        .close-btn { 
            position: absolute; 
            top: 5px; right: 5px; 
            background: #ff6666; 
            border: 2px outset #fff; 
            font-family: Arial, sans-serif; 
            font-size: 12px; 
            font-weight: bold; 
            color: white; 
            cursor: pointer; 
            padding: 2px 6px; 
        }
        .close-btn:active { border: 2px inset #fff; }

        .rules-title { 
            font-size: 1.1rem; 
            font-weight: bold; 
            color: #000080; 
            margin-bottom: 15px; 
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }
        .rules-list { 
            margin: 0; 
            padding-left: 20px; 
            color: #333; 
            font-size: 0.95rem; 
            line-height: 1.8; 
            font-weight: bold; 
        }
        
        /* 輸入框 */
        .name-input { 
            width: 100%; 
            padding: 8px; 
            font-family: inherit; 
            font-size: 1rem; 
            border: 2px inset #ccc; 
            margin-bottom: 20px; 
            text-align: center; 
        }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <div class="top-nav">
        <a href="https://youtu.be/ks_qOI0lzho?si=lkYcmimHFsbbUYja">播放</a>
        <a href="#">暫停</a>
        <a href="#">取消</a>
        <a href="index.html">回到主頁</a>
    </div>

    <!-- 主視窗 -->
    <div class="window-panel">
        <div class="window-header">
            <span>有線耳機復活計畫</span>
            <span>_ X</span>
        </div>
        
        <h2 style="font-size: 1.5rem; color: #4a3b7a; margin-bottom: 10px;">✮ 有線耳機復活計畫 ♫</h2>
        
        <div class="info-box">
            <p>恭喜你成為有線耳機復活計畫的一員！</p>
            <p style="color: #33cc99;">♪ 好時光都該被寶貝因為有線~ ♪</p> <!-- 修改為薄荷綠 -->
            
            <p style="margin-top: 15px;">您是第</p>
            <div class="number-area">
                <span id="member-id" class="custom-number">000000</span>
            </div>
            <p>位加入的會員</p>
        </div>

        <div class="btn-group">
            <button id="download-trigger-btn" class="btn-glossy">下載會員卡</button>
            <button id="open-rules-btn" class="btn-glossy btn-yellow">規則</button>
        </div>
    </div>

    <!-- 規則彈出視窗 -->
    <div id="rules-modal" class="modal-overlay">
        <div class="modal-content">
            <button id="close-rules-btn" class="close-btn">X</button>
            <div class="rules-title">★ 秘密會員規則 ★</div>
            <ul class="rules-list">
                <li>1. 需每天帶有線耳機出門。</li>
                <li>2. 擁有【有線耳機復活計畫】小卡。</li>
                <li>3. 尊重所有類型的音樂。</li>
                <li>4. 音樂沒有優劣之分。</li>
            </ul>
        </div>
    </div>

    <!-- 名字輸入彈出視窗 -->
    <div id="name-modal" class="modal-overlay">
        <div class="modal-content">
            <button id="close-name-btn" class="close-btn">X</button>
            <div class="rules-title">★ 建立專屬會員卡 ★</div>
            <input type="text" id="user-name-input" class="name-input" placeholder="Enter Name..." maxlength="10">
            <div style="text-align: center;">
                <button id="confirm-download-btn" class="btn-glossy">確認 (OK)</button>
            </div>
        </div>
    </div>

    <canvas id="download-canvas" width="600" height="400" style="display: none;"></canvas>

<script>
    // 1. 彈出視窗控制
    const rulesModal = document.getElementById('rules-modal');
    const nameModal = document.getElementById('name-modal');
    document.getElementById('open-rules-btn').onclick = (e) => { e.preventDefault(); rulesModal.style.display = 'flex'; };
    document.getElementById('close-rules-btn').onclick = () => rulesModal.style.display = 'none';
    document.getElementById('close-name-btn').onclick = () => nameModal.style.display = 'none';
    document.getElementById('download-trigger-btn').onclick = () => nameModal.style.display = 'flex';

    // 2. 獲取編號 (加入跳動動畫)
    const numberElement = document.getElementById('member-id');
    const gasUrl = 'https://script.google.com/macros/s/AKfycbytIyUt9P-5lejKe6KfYZxd2VezUG-Hy15wXGmooAQk78Rxw3erRx3HJu07LhawKektfA/exec';

    // 先讓數字瘋狂跳動
    let isFetched = false;
    const interval = setInterval(() => {
        if(!isFetched) {
            numberElement.innerText = Math.floor(Math.random() * 900000 + 100000);
        }
    }, 80);

    fetch(gasUrl)
        .then(res => res.json())
        .then(data => {
            isFetched = true;
            clearInterval(interval); 
            const num = data.value || data; 
            numberElement.innerText = String(num).padStart(6, '0');
        })
        .catch(err => {
            isFetched = true;
            clearInterval(interval); 
            console.error("無法抓取編號:", err);
            numberElement.innerText = "999999"; 
        });

    // 3. 下載邏輯 (維持原狀)
    document.getElementById('confirm-download-btn').addEventListener('click', () => {
        const name = document.getElementById('user-name-input').value.trim() || '隱形會員';
        const formattedNumber = numberElement.innerText;
        const canvas = document.getElementById('download-canvas');
        const ctx = canvas.getContext('2d');
        const bgImg = new Image();
        
        bgImg.crossOrigin = "Anonymous"; 
        bgImg.src = '9.PNG?' + new Date().getTime(); 
        bgImg.onload = function() {
            ctx.drawImage(bgImg, 0, 0, 600, 400);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#2F4F4F';
            ctx.font = 'bold 34px "PML", serif';
            ctx.fillText('有線耳機復活計畫', 300, 130);
            ctx.font = '26px "PML", serif';
            ctx.fillText(`會員：${name}`, 300, 210);
            ctx.font = 'bold 22px monospace';
            ctx.fillText(`ID: ${formattedNumber}`, 300, 270);
            
            const link = document.createElement('a');
            link.download = `member-${formattedNumber}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            nameModal.style.display = 'none';
        };
    });
</script>
</body>
</html>
